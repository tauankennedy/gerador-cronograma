<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cronograma</title>
    <style>
        :root {
            --base-font-size: 16px;
            --bg-color: #1a1a1a;
            --card-bg: #262626;
            --accent-color: #4a90e2;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #3a3a3a;
            --grid-bg: #1e1e1e;
            --p-color: #2ecc71;
            --a-color: #e67e22;
            --q-color: #9b59b6;
            --red-accent: #e74c3c;
            --red-hover: #c0392b;
        }

        body.light-theme {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --accent-color: #2b6cb0;
            --text-color: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --grid-bg: #f8fafc;
            --p-color: #27ae60;
            --a-color: #d35400;
            --q-color: #8e44ad;
        }

        html {
            scroll-behavior: smooth;
            font-size: var(--base-font-size);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            font-size: 1rem;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 15px 0;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
            transition: background-color 0.3s;
        }

        .header-title-group {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        h2 {
            margin: 0;
            font-weight: 600;
            font-size: 20px;
        }

        .author-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-action {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action:hover {
            border-color: var(--accent-color);
            background-color: var(--border-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        input[type="date"], input[type="text"], select, .btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1rem;
        }

        input[type="date"]:focus, input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .export-bar {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .search-bar {
            margin-bottom: 15px;
        }

        .area-title {
            background: var(--card-bg);
            padding: 10px 14px;
            margin: 25px 0 15px 0;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid var(--accent-color);
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            transition: opacity 0.2s;
        }

        .card.completed {
            opacity: 0.55;
            text-decoration: line-through;
        }

        .card-header {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .data-main {
            color: var(--accent-color);
        }

        .sub-section {
            margin-top: 10px;
            padding-left: 10px;
            border-left: 2px solid var(--border-color);
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            margin: 8px 0 6px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .title-p { color: var(--p-color); }
        .title-a { color: var(--a-color); }
        .title-q { color: var(--q-color); }

        .grid-config {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: var(--grid-bg);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .grid-header {
            font-weight: bold;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        .empty-field {
            color: var(--text-muted);
            font-style: italic;
        }

        .alert {
            background: rgba(230, 126, 34, 0.15);
            border-left: 4px solid var(--a-color);
            padding: 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .back-to-top {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background-color: var(--red-accent);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 0;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s, transform 0.2s, background-color 0.2s;
            z-index: 1000;
        }

        .back-to-top.show {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            background-color: var(--red-hover);
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(231, 76, 60, 0.6);
        }

        .back-to-top svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
            display: block;
        }

        @media print {
            .controls-group, .form-group, .btn-primary, .export-bar, .search-bar, .back-to-top {
                display: none !important;
            }
            .header-bar {
                position: static;
                border-bottom: 1px solid #ddd;
                margin-bottom: 20px;
            }
            body {
                background: #fff !important;
                color: #000 !important;
            }
            .card {
                border: 1px solid #ccc !important;
                background: #fff !important;
                page-break-inside: avoid;
            }
            .author-tag {
                color: #666 !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="header-title-group">
            <h2>Gerador de Cronograma</h2>
            <span class="author-tag">By: Tauan França</span>
        </div>
        <div class="controls-group">
            <button class="btn-action" onclick="alterarTamanhoFonte(-1)" title="Diminuir fonte">A-</button>
            <button class="btn-action" onclick="alterarTamanhoFonte(1)" title="Aumentar fonte">A+</button>
            <button class="btn-action" onclick="alternarTema()" id="themeBtn">☀️ Modo Claro</button>
        </div>
    </div>
    
    <div class="form-group">
        <label for="periodo">Período</label>
        <select id="periodo" onchange="salvarFormulario()">
            <option value="" disabled selected>Selecione o período...</option>
            <option value="P1">P1</option>
            <option value="P2">P2</option>
            <option value="P3">P3</option>
            <option value="P4">P4</option>
            <option value="P5">P5</option>
            <option value="P6">P6</option>
            <option value="P7">P7</option>
            <option value="P8">P8</option>
        </select>
    </div>

    <div class="form-group">
        <label for="dataInicio">Data de início do bloco</label>
        <input type="date" id="dataInicio" onchange="validarEsalvarData()">
        <div id="dataValidationAlert"></div>
    </div>

    <div class="form-group">
        <label for="tipoAtividade">Exibir Atividades</label>
        <select id="tipoAtividade" onchange="salvarFormulario()">
            <option value="TODOS" selected>Tudo (Encontros, Autoavaliação e Quizzes)</option>
            <option value="ENCONTROS">Apenas Encontros de Tutoria</option>
            <option value="AUTOAVALIACAO">Apenas Autoavaliação</option>
            <option value="QUIZZES">Apenas Quizzes</option>
        </select>
    </div>

    <button class="btn-primary" onclick="gerarCronograma()">Gerar Cronograma</button>

    <div id="exportBarContainer" class="export-bar" style="display:none;">
        <button class="btn-action" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
    </div>

    <div id="searchBarContainer" class="search-bar" style="display:none;">
        <input type="text" id="searchInput" placeholder="🔍 Filtrar encontros ou quizzes..." oninput="filtrarCards()">
    </div>

    <div id="resultado"></div>
</div>

<button class="back-to-top" id="btnBackToTop" onclick="subirParaOTopo()" title="Voltar ao topo">
    <svg viewBox="0 0 24 24">
        <path d="M12 4l-8 8h5v8h6v-8h5z"/>
    </svg>
</button>

<script>
    let currentFontSize = 16;
    const diasSemanaNomes = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];

    window.onload = function() {
        carregarPreferencias();
    };

    function carregarPreferencias() {
        const savedTheme = localStorage.getItem('cronograma_theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('themeBtn').innerText = '🌙 Modo Escuro';
        }

        const savedFont = localStorage.getItem('cronograma_font');
        if (savedFont) {
            currentFontSize = parseInt(savedFont);
            document.documentElement.style.setProperty('--base-font-size', `${currentFontSize}px`);
        }

        const savedPeriodo = localStorage.getItem('cronograma_periodo');
        if (savedPeriodo) document.getElementById('periodo').value = savedPeriodo;

        const savedData = localStorage.getItem('cronograma_data');
        if (savedData) document.getElementById('dataInicio').value = savedData;

        const savedTipoAtividade = localStorage.getItem('cronograma_tipo_atividade');
        if (savedTipoAtividade) document.getElementById('tipoAtividade').value = savedTipoAtividade;
    }

    function salvarFormulario() {
        localStorage.setItem('cronograma_periodo', document.getElementById('periodo').value);
        localStorage.setItem('cronograma_tipo_atividade', document.getElementById('tipoAtividade').value);
    }

    function validarEsalvarData() {
        const dataVal = document.getElementById('dataInicio').value;
        localStorage.setItem('cronograma_data', dataVal);
        const alertDiv = document.getElementById('dataValidationAlert');
        
        if (!dataVal) return;
        const selectedDate = new Date(dataVal + 'T00:00:00');
        const dayOfWeek = selectedDate.getDay();

        if (dayOfWeek === 0 || dayOfWeek === 6) {
            alertDiv.innerHTML = '<div class="alert" style="margin-top:8px;">⚠️ Atenção: A data inicial selecionada cai em um fim de semana.</div>';
        } else {
            alertDiv.innerHTML = '';
        }
    }

    function alterarTamanhoFonte(delta) {
        currentFontSize += delta;
        if (currentFontSize < 12) currentFontSize = 12;
        if (currentFontSize > 26) currentFontSize = 26;
        document.documentElement.style.setProperty('--base-font-size', `${currentFontSize}px`);
        localStorage.setItem('cronograma_font', currentFontSize);
    }

    function alternarTema() {
        const body = document.body;
        const btn = document.getElementById('themeBtn');
        body.classList.toggle('light-theme');
        
        if (body.classList.contains('light-theme')) {
            btn.innerText = '🌙 Modo Escuro';
            localStorage.setItem('cronograma_theme', 'light');
        } else {
            btn.innerText = '☀️ Modo Claro';
            localStorage.setItem('cronograma_theme', 'dark');
        }
    }

    window.onscroll = function() {
        const btn = document.getElementById('btnBackToTop');
        if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
            btn.classList.add('show');
        } else {
            btn.classList.remove('show');
        }
    };

    function subirParaOTopo() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function formatarTextoVazio(valor) {
        if (!valor || valor === '-' || valor === '') {
            return '<span class="empty-field">vazio</span>';
        }
        return valor;
    }

    function formatarData(date) {
        if (!date) return formatarTextoVazio(null);
        const dia = String(date.getDate()).padStart(2, '0');
        const mes = String(date.getMonth() + 1).padStart(2, '0');
        const ano = date.getFullYear();
        return `${dia}/${mes}/${ano}`;
    }

    function obterDiaSemana(date) {
        if (!date) return formatarTextoVazio(null);
        return diasSemanaNomes[date.getDay()];
    }

    function adicionarDias(date, dias) {
        const resultado = new Date(date.getTime());
        resultado.setDate(resultado.getDate() + dias);
        return resultado;
    }

    function obterSextaAnterior(date) {
        const resultado = new Date(date.getTime());
        let diasParaSubtrair = resultado.getDay() - 5;
        if (diasParaSubtrair <= 0) diasParaSubtrair += 7;
        resultado.setDate(resultado.getDate() - diasParaSubtrair);
        return resultado;
    }

    function obterPrimeiraSegunda(dataReferencia) {
        const resultado = new Date(dataReferencia.getTime());
        const diaSemana = resultado.getDay();
        let diasParaSegunda = (8 - diaSemana) % 7;
        if (diasParaSegunda === 0) diasParaSegunda = 7;
        resultado.setDate(resultado.getDate() + diasParaSegunda);
        return resultado;
    }

    function toggleCardComplete(cardId) {
        const card = document.getElementById(cardId);
        const checkbox = card.querySelector('.card-checkbox');
        
        if (checkbox.checked) {
            card.classList.add('completed');
            localStorage.setItem(`card_done_${cardId}`, 'true');
            rolarParaProximoCard(card);
        } else {
            card.classList.remove('completed');
            localStorage.removeItem(`card_done_${cardId}`);
        }
    }

    function rolarParaProximoCard(cardAtual) {
        const todosCards = Array.from(document.querySelectorAll('.card'));
        const indexAtual = todosCards.indexOf(cardAtual);
        
        let proximoCard = null;
        for (let i = indexAtual + 1; i < todosCards.length; i++) {
            if (!todosCards[i].classList.contains('completed')) {
                proximoCard = todosCards[i];
                break;
            }
        }

        if (!proximoCard && indexAtual < todosCards.length - 1) {
            proximoCard = todosCards[indexAtual + 1];
        }

        if (proximoCard) {
            const headerOffset = 70;
            const cardPosition = proximoCard.getBoundingClientRect().top + window.pageYOffset;
            const offsetPosition = cardPosition - headerOffset;

            window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
            });
        }
    }

    function filtrarCards() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            const text = card.innerText.toLowerCase();
            card.style.display = text.includes(query) ? 'block' : 'none';
        });
    }

    function gerarHtmlQuiz(numeroQuiz, dataBase) {
        const primeiraSegunda = obterPrimeiraSegunda(dataBase);
        const quizEntrega = adicionarDias(primeiraSegunda, (numeroQuiz - 1) * 7);
        const quizSexta = adicionarDias(quizEntrega, -3);
        const quizTerca = adicionarDias(quizEntrega, 1);

        const cardId = `quiz_${numeroQuiz}_${quizEntrega.getTime()}`;
        const isDone = localStorage.getItem(`card_done_${cardId}`) === 'true';

        return `
        <div class="card ${isDone ? 'completed' : ''}" id="${cardId}">
            <div class="card-header">
                <div class="card-header-left">
                    <input type="checkbox" class="card-checkbox" onchange="toggleCardComplete('${cardId}')" ${isDone ? 'checked' : ''}>
                    <span>Quiz ${String(numeroQuiz).padStart(2, '0')}</span>
                </div>
                <span class="data-main">${formatarData(quizEntrega)}</span>
            </div>
            <div class="sub-section">
                <div class="section-title title-q">● Quiz</div>
                <div class="grid-config grid-header">
                    <div>Configuração</div><div>Data</div><div>Tempo</div><div>Dia da Semana</div>
                </div>
                <div class="grid-config">
                    <div>Prazo de entrega</div><div>${formatarData(quizEntrega)}</div><div>23:59</div><div>${obterDiaSemana(quizEntrega)}</div>
                </div>
                <div class="grid-config">
                    <div>Disponível a partir de</div><div>${formatarData(quizSexta)}</div><div>08:00</div><div>${obterDiaSemana(quizSexta)}</div>
                </div>
                <div class="grid-config">
                    <div>Até</div><div>${formatarData(quizEntrega)}</div><div>23:59</div><div>${obterDiaSemana(quizEntrega)}</div>
                </div>
                <div class="grid-config">
                    <div>Gabarito Disponível</div><div>${formatarData(quizTerca)}</div><div>00:05</div><div>${obterDiaSemana(quizTerca)}</div>
                </div>
            </div>
        </div>`;
    }

    function gerarCronograma() {
        const periodo = document.getElementById('periodo').value;
        const dataInicioInput = document.getElementById('dataInicio').value;
        const tipoAtividade = document.getElementById('tipoAtividade').value;
        const resultadoDiv = document.getElementById('resultado');

        if (!periodo || !dataInicioInput) {
            resultadoDiv.innerHTML = '<div class="alert">Por favor, preencha o Período e a Data de início do bloco.</div>';
            return;
        }

        let dataAtual = new Date(dataInicioInput + 'T00:00:00');
        const dataInicialRef = new Date(dataAtual.getTime());
        resultadoDiv.innerHTML = '';

        let encontros = [];

        if (['P2', 'P3', 'P4'].includes(periodo)) {
            while (dataAtual.getDay() !== 4) {
                dataAtual = adicionarDias(dataAtual, 1);
            }
            
            let diaSeguinte = 4;
            while (encontros.length < 8) {
                if (dataAtual.getDay() === diaSeguinte) {
                    encontros.push(new Date(dataAtual.getTime()));
                    diaSeguinte = (diaSeguinte === 4) ? 1 : 4;
                }
                dataAtual = adicionarDias(dataAtual, 1);
            }
        } else {
            let diasPermitidos = (periodo === 'P1') ? [3, 0] : [0];
            while (encontros.length < 8) {
                if (diasPermitidos.includes(dataAtual.getDay())) {
                    encontros.push(new Date(dataAtual.getTime()));
                }
                dataAtual = adicionarDias(dataAtual, 1);
            }
        }

        let horaPadrao = (periodo === 'P2') ? "12:00" : "23:59";
        let htmlGerado = '';
        const ehDivididoPorAreas = ['P5', 'P6', 'P7', 'P8'].includes(periodo);

        const exibirEncontros = (tipoAtividade === 'TODOS' || tipoAtividade === 'ENCONTROS');
        const exibirAutoAvFiltro = (tipoAtividade === 'TODOS' || tipoAtividade === 'AUTOAVALIACAO');
        const exibirQuizzesFiltro = (tipoAtividade === 'TODOS' || tipoAtividade === 'QUIZZES');

        if (exibirEncontros || exibirAutoAvFiltro) {
            encontros.forEach((encontro, index) => {
                const numeroEncontro = index + 1;

                if (ehDivididoPorAreas) {
                    if (numeroEncontro === 1) htmlGerado += '<div class="area-title">1ª Área (Encontro 1 a 4)</div>';
                    if (numeroEncontro === 5) htmlGerado += '<div class="area-title">2ª Área (Encontro 1 a 4)</div>';
                }

                let labelEncontro = numeroEncontro;
                if (ehDivididoPorAreas && numeroEncontro > 4) labelEncontro = numeroEncontro - 4;

                let autoAvData = null;
                let terAutoAv = false;
                let numAutoAv = 0;

                if (['P1', 'P2', 'P3', 'P4'].includes(periodo)) {
                    if (numeroEncontro % 2 === 0) {
                        autoAvData = encontros[index - 1];
                        terAutoAv = true;
                        numAutoAv = numeroEncontro / 2;
                    }
                } else {
                    autoAvData = obterSextaAnterior(encontro);
                    terAutoAv = true;
                    numAutoAv = labelEncontro;
                }

                const cardId = `enc_${periodo}_${numeroEncontro}_${encontro.getTime()}`;
                const isDone = localStorage.getItem(`card_done_${cardId}`) === 'true';

                if (tipoAtividade === 'AUTOAVALIACAO' && !terAutoAv) return;

                htmlGerado += `
                <div class="card ${isDone ? 'completed' : ''}" id="${cardId}">
                    <div class="card-header">
                        <div class="card-header-left">
                            <input type="checkbox" class="card-checkbox" onchange="toggleCardComplete('${cardId}')" ${isDone ? 'checked' : ''}>
                            <span>Encontro ${labelEncontro} (${periodo})</span>
                        </div>
                        <span class="data-main">${formatarData(encontro)}</span>
                    </div>`;

                if (exibirEncontros) {
                    htmlGerado += `
                    <div class="sub-section">
                        <div class="section-title title-p">● Tutoria / Encontro</div>
                        <div class="grid-config grid-header">
                            <div>Configuração</div><div>Data</div><div>Tempo</div><div>Dia da Semana</div>
                        </div>
                        <div class="grid-config">
                            <div>Prazo de entrega</div><div>${formatarData(encontro)}</div><div>${horaPadrao}</div><div>${obterDiaSemana(encontro)}</div>
                        </div>
                        <div class="grid-config">
                            <div>Disponível a partir de</div><div>${formatarTextoVazio(null)}</div><div>${formatarTextoVazio(null)}</div><div>${formatarTextoVazio(null)}</div>
                        </div>
                        <div class="grid-config">
                            <div>Até</div><div>${formatarData(encontro)}</div><div>${horaPadrao}</div><div>${obterDiaSemana(encontro)}</div>
                        </div>
                    </div>`;
                }

                if (exibirAutoAvFiltro && terAutoAv) {
                    htmlGerado += `
                    <div class="sub-section">
                        <div class="section-title title-a">● Autoavaliação ${String(numAutoAv).padStart(2, '0')}</div>
                        <div class="grid-config grid-header">
                            <div>Configuração</div><div>Data</div><div>Tempo</div><div>Dia da Semana</div>
                        </div>
                        <div class="grid-config">
                            <div>Prazo de entrega</div><div>${formatarTextoVazio(null)}</div><div>${formatarTextoVazio(null)}</div><div>${formatarTextoVazio(null)}</div>
                        </div>
                        <div class="grid-config">
                            <div>Disponível a partir de</div><div>${formatarData(autoAvData)}</div><div>17:00</div><div>${obterDiaSemana(autoAvData)}</div>
                        </div>
                        <div class="grid-config">
                            <div>Até</div><div>${formatarTextoVazio(null)}</div><div>${formatarTextoVazio(null)}</div><div>${formatarTextoVazio(null)}</div>
                        </div>
                    </div>`;

                    // Inclusão da Autoavaliação - Dinâmica de Grupo após a Autoavaliação 04
                    if (numAutoAv === 4) {
                        htmlGerado += `
                        <div class="sub-section">
                            <div class="section-title title-a">● Autoavaliação - Dinâmica de Grupo</div>
                            <div class="grid-config grid-header">
                                <div>Configuração</div><div>Data</div><div>Tempo</div><div>Dia da Semana</div>
                            </div>
                            <div class="grid-config">
                                <div>Prazo de entrega</div><div>${formatarTextoVazio(null)}</div><div>${formatarTextoVazio(null)}</div><div>${formatarTextoVazio(null)}</div>
                            </div>
                            <div class="grid-config">
                                <div>Disponível a partir de</div><div>${formatarData(autoAvData)}</div><div>00:00</div><div>${obterDiaSemana(autoAvData)}</div>
                            </div>
                            <div class="grid-config">
                                <div>Até</div><div>${formatarTextoVazio(null)}</div><div>${formatarTextoVazio(null)}</div><div>${formatarTextoVazio(null)}</div>
                            </div>
                        </div>`;
                    }
                }

                htmlGerado += `</div>`;

                if (tipoAtividade === 'TODOS' && ehDivididoPorAreas && numeroEncontro === 4) {
                    htmlGerado += '<div class="area-title">Quizzes - 1ª Área</div>';
                    for (let q = 1; q <= 4; q++) {
                        htmlGerado += gerarHtmlQuiz(q, encontros[0]);
                    }
                }
            });
        }

        if (exibirQuizzesFiltro) {
            if (ehDivididoPorAreas) {
                if (tipoAtividade !== 'TODOS') {
                    htmlGerado += '<div class="area-title">Quizzes - 1ª Área</div>';
                    for (let q = 1; q <= 4; q++) {
                        htmlGerado += gerarHtmlQuiz(q, encontros[0]);
                    }
                }
                htmlGerado += '<div class="area-title">Quizzes - 2ª Área</div>';
                for (let q = 1; q <= 4; q++) {
                    htmlGerado += gerarHtmlQuiz(q, encontros[4]);
                }
            } else {
                htmlGerado += '<div class="area-title">Quizzes do Período</div>';
                for (let q = 1; q <= 4; q++) {
                    htmlGerado += gerarHtmlQuiz(q, dataInicialRef);
                }
            }
        }

        resultadoDiv.innerHTML = htmlGerado;
        document.getElementById('exportBarContainer').style.display = 'flex';
        document.getElementById('searchBarContainer').style.display = 'block';
    }
</script>
</body>
</html>
